name: Tests

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app ships for Windows only, but nothing outside the .exe helpers
        # is Windows-specific, and Ubuntu catches path and encoding assumptions
        # that would otherwise only surface on someone else's machine.
        os: [ubuntu-latest, windows-latest]
        # Every version pyproject.toml's requires-python claims, up to the
        # newest release. Keep the two in step when you add or drop a version.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    env:
      # test_gui.py builds the real main window; runners have no display.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The PyQt5 wheels bundle Qt itself but link against these system
      # libraries, which a bare Ubuntu runner does not all carry.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # Installed from pyproject.toml's ranges, not requirements.txt, so each
      # Python gets the newest numpy/matplotlib it supports -- the versions a
      # fresh install would get today.
      - name: Install the package with test extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
