[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapkel-rtp"
# Read from dapkel_rtp.__version__ rather than duplicated here. This file used to
# carry its own literal and was left at 0.0.1 through the 0.1.0 release, so the
# installed package, the app and the CHANGELOG all disagreed. One source now.
dynamic = ["version"]
description = "DAPKEL-RTP — Data Analysis Package for KELpie, real-time plotting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sergei Kulkov", email = "sergei.kulkov23@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools.dynamic]
version = { attr = "dapkel_rtp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dapkel_rtp" = [
    "functions/helpers/*.exe",
    "functions/helpers/*.dll",
    "params/camera/programs/*.txt",
    "params/camera/bitfile/*.bit",
    # One bitfile folder per firmware version; Kelpie_v2_pwr_mgt.exe selects a
    # version by the directory it is launched from (see gui/gui/_paths.py).
    "params/camera/short_exposure/bitfile/*.bit",
    "params/camera/long_exposure/bitfile/*.bit",
]
