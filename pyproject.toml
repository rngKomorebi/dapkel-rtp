[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapkel-rtp"
version = "0.0.1"
description = "DAPKEL-RTP — Data Analysis Package for KELpie, real-time plotting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sergei Kulkov", email = "sergei.kulkov23@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dapkel_rtp" = [
    "functions/helpers/*.exe",
    "functions/helpers/*.dll",
    "params/camera/programs/*.txt",
    "params/camera/bitfile/*.bit",
]
